<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgP1)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="180" y="11" width="240" height="20" rx="6" fill="#0f172a" opacity="0.6"/>
  <text x="300" y="25" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">devpulse.analytics.io</text>

  <!-- Sidebar -->
  <rect x="20" y="60" width="110" height="280" rx="10" fill="#1e293b" opacity="0.6"/>
  <rect x="35" y="80" width="80" height="12" rx="4" fill="#6366f1"/>
  <rect x="35" y="106" width="65" height="8" rx="4" fill="#475569"/>
  <rect x="35" y="126" width="70" height="8" rx="4" fill="#475569"/>
  <rect x="35" y="146" width="55" height="8" rx="4" fill="#475569"/>
  <rect x="35" y="166" width="60" height="8" rx="4" fill="#475569"/>

  <!-- Metric Cards -->
  <rect x="145" y="60" width="135" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="160" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif">Total Commits</text>
  <text x="160" y="112" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">14,280</text>
  <circle cx="255" cy="85" r="10" fill="#38bdf8" opacity="0.2"/>
  <text x="255" y="89" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">↑</text>

  <rect x="295" y="60" width="135" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="310" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif">Active Deploys</text>
  <text x="310" y="112" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">99.98%</text>
  <circle cx="405" cy="85" r="10" fill="#10b981" opacity="0.2"/>
  <text x="405" y="89" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">✓</text>

  <rect x="445" y="60" width="135" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="460" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif">Avg Response</text>
  <text x="460" y="112" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">32ms</text>
  <circle cx="555" cy="85" r="10" fill="#ec4899" opacity="0.2"/>
  <text x="555" y="89" fill="#ec4899" font-size="11" font-weight="bold" text-anchor="middle">⚡</text>

  <!-- Big Graph Section -->
  <rect x="145" y="145" width="285" height="195" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="165" y="172" fill="#f8fafc" font-size="13" font-weight="bold" font-family="sans-serif">System Throughput & Performance</text>
  <!-- Area chart -->
  <path d="M 165 295 L 165 240 Q 200 210, 240 250 T 320 200 T 405 185 L 405 295 Z" fill="url(#chartGrad)"/>
  <path d="M 165 240 Q 200 210, 240 250 T 320 200 T 405 185" fill="none" stroke="#6366f1" stroke-width="3"/>
  <circle cx="405" cy="185" r="5" fill="#818cf8"/>

  <!-- Bar Breakdown Section -->
  <rect x="445" y="145" width="135" height="195" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="460" y="172" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Traffic Load</text>
  
  <rect x="460" y="240" width="16" height="60" rx="3" fill="url(#barGrad1)"/>
  <rect x="485" y="210" width="16" height="90" rx="3" fill="url(#barGrad2)"/>
  <rect x="510" y="190" width="16" height="110" rx="3" fill="url(#barGrad1)"/>
  <rect x="535" y="225" width="16" height="75" rx="3" fill="#10b981"/>
</svg>
