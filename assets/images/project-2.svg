  <text x="420" y="275" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Ultrabook M3 16"</text>
  <text x="420" y="295" fill="#10b981" font-size="14" font-weight="bold" font-family="sans-serif">$1,299</text>
