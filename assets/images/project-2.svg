  <text x="512" y="100" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Shop Now</text>

  <!-- Product Cards Grid -->
  <!-- Product 1 -->
  <rect x="25" y="152" width="165" height="185" rx="12" fill="#0f172a" stroke="#047857" stroke-width="1"/>
  <rect x="40" y="168" width="135" height="85" rx="8" fill="#1e293b"/>
  <circle cx="107" cy="210" r="28" fill="#059669" opacity="0.3"/>
  <text x="107" y="215" fill="#34d399" font-size="22" text-anchor="middle">🎧</text>
  <text x="40" y="275" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Pro Noise Canceling</text>
  <text x="40" y="295" fill="#10b981" font-size="14" font-weight="bold" font-family="sans-serif">$249.99</text>
  <rect x="135" y="280" width="40" height="24" rx="6" fill="#10b981"/>
  <text x="155" y="296" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">+</text>

  <!-- Product 2 -->
  <rect x="215" y="152" width="165" height="185" rx="12" fill="#0f172a" stroke="#047857" stroke-width="1"/>
  <rect x="230" y="168" width="135" height="85" rx="8" fill="#1e293b"/>
  <circle cx="297" cy="210" r="28" fill="#0284c7" opacity="0.3"/>
