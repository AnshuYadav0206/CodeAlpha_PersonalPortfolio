  <text x="230" y="275" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Smart OLED Watch</text>
  <text x="230" y="295" fill="#10b981" font-size="14" font-weight="bold" font-family="sans-serif">$179.00</text>
  <rect x="325" y="280" width="40" height="24" rx="6" fill="#10b981"/>
  <text x="345" y="296" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">+</text>

  <!-- Product 3 -->
  <rect x="405" y="152" width="170" height="185" rx="12" fill="#0f172a" stroke="#047857" stroke-width="1"/>
  <rect x="420" y="168" width="140" height="85" rx="8" fill="#1e293b"/>
  <circle cx="490" cy="210" r="28" fill="#ec4899" opacity="0.3"/>
