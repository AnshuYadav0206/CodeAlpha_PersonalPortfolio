<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgP2)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#064e3b" opacity="0.8"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="180" y="11" width="240" height="20" rx="6" fill="#022c22" opacity="0.7"/>
  <text x="300" y="25" fill="#6ee7b7" font-size="11" font-family="sans-serif" text-anchor="middle">store.cloudmart.shop</text>

