  <text x="46" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#656d76">SQL Schema Migration</text>
  <text x="46" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#656d76">Unit Test Suite</text>
  <text x="46" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#656d76">Regex Parser</text>
