  <line x1="226" y1="102" x2="560" y2="102" stroke="#e1e4e8" stroke-width="1"/>
  <rect x="226" y="114" width="334" height="182" rx="3" fill="#f6f8fa" stroke="#e1e4e8" stroke-width="1"/>
  <text x="242" y="142" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#1f2328">const express = require('express');</text>
  <text x="242" y="166" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#1f2328">const app = express();</text>
  <text x="242" y="190" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#0969da">app.use(express.json());</text>
  <text x="242" y="214" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#1f2328">app.get('/api/health', (req, res) =&gt; {</text>
  <text x="260" y="238" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#1f2328">res.status(200).json({ status: 'ok' });</text>
  <text x="242" y="262" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#1f2328">});</text>
