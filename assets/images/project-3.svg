<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18002e" />
      <stop offset="50%" stop-color="#2d0a4e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgP3)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#2e1065" opacity="0.8"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="180" y="11" width="240" height="20" rx="6" fill="#1e1035" opacity="0.7"/>
  <text x="300" y="25" fill="#d8b4fe" font-size="11" font-family="sans-serif" text-anchor="middle">ai.promptgenius.app</text>

  <!-- Left Chat History / Models -->
  <rect x="20" y="58" width="130" height="282" rx="10" fill="#1e1035" stroke="#4c1d95" stroke-width="1"/>
  <rect x="32" y="75" width="106" height="28" rx="6" fill="url(#aiGrad)"/>
  <text x="85" y="93" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">+ New Chat</text>
  <rect x="32" y="115" width="106" height="12" rx="4" fill="#6b21a8" opacity="0.5"/>
  <rect x="32" y="135" width="85" height="10" rx="4" fill="#4c1d95" opacity="0.4"/>
  <rect x="32" y="153" width="95" height="10" rx="4" fill="#4c1d95" opacity="0.4"/>
  <rect x="32" y="171" width="75" height="10" rx="4" fill="#4c1d95" opacity="0.4"/>

  <!-- Chat stream view -->
  <rect x="165" y="58" width="415" height="225" rx="10" fill="#0f172a" stroke="#3b0764" stroke-width="1"/>
  
  <!-- User prompt bubble -->
  <rect x="270" y="75" width="295" height="42" rx="8" fill="#3b0764"/>
  <text x="285" y="100" fill="#f3e8ff" font-size="12" font-family="sans-serif">Generate a full REST API for user auth with JWT in Node.js</text>

  <!-- AI Response bubble -->
  <rect x="180" y="128" width="385" height="140" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <circle cx="205" cy="148" r="10" fill="url(#aiGrad)"/>
  <text x="205" y="152" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">AI</text>
  <text x="225" y="152" fill="#c084fc" font-size="12" font-weight="bold" font-family="sans-serif">PromptGenius AI v2.5</text>

  <!-- Code snippet in reply -->
  <rect x="195" y="168" width="355" height="85" rx="6" fill="#090d16"/>
  <text x="210" y="188" fill="#ec4899" font-size="11" font-family="monospace">const <tspan fill="#38bdf8">jwt</tspan> = require('jsonwebtoken');</text>
  <text x="210" y="206" fill="#93c5fd" font-size="11" font-family="monospace">const <tspan fill="#a78bfa">token</tspan> = jwt.sign({ id: user._id }, process.env.SECRET);</text>
  <text x="210" y="224" fill="#34d399" font-size="11" font-family="monospace">res.status(200).json({ success: true, token });</text>

  <!-- Input bar -->
  <rect x="165" y="295" width="415" height="45" rx="10" fill="#1e1b4b" stroke="#4c1d95" stroke-width="1"/>
  <text x="185" y="322" fill="#94a3b8" font-size="12" font-family="sans-serif">Type your prompt or ask for refactoring...</text>
  <rect x="540" y="303" width="30" height="28" rx="6" fill="url(#aiGrad)"/>
  <text x="555" y="321" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">→</text>
</svg>
