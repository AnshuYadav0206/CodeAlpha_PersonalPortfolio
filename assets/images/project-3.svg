  <text x="40" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2328">Saved Templates</text>
  <line x1="40" y1="102" x2="178" y2="102" stroke="#e1e4e8" stroke-width="1"/>
